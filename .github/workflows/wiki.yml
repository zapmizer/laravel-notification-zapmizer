name: Wiki

# The wiki mirrors docs/ on main. Every page is generated again, so edits made on the wiki itself are overwritten.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/wiki.php']
  workflow_dispatch:

permissions:
  contents: write

concurrency: wiki

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Clone the wiki
        run: git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki

      - run: php scripts/wiki.php wiki

      - name: Push the wiki
        working-directory: wiki
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Wiki already up to date."; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Sync docs/ from ${GITHUB_SHA::7}"
          git push
